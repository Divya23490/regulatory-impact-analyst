[project]
name = "regimpact"
version = "0.1.0"
description = "Regulatory Change Impact Analyst — LangGraph spine + Deep Agents research + AutoGen review committee"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3",  # deepagents imports this internally at load time
    "deepagents>=0.7",
    "autogen-agentchat>=0.4",
    "autogen-ext[openai]>=0.4",
    "python-dotenv",
    "rich",
    # RAG
    "google-genai",                    # Gemini embeddings (gemini-embedding-001)
    "chromadb>=1.0",                   # vector store: persistent, HNSW, metadata filters
    # Version pins resolving a real conflict: autogen-core requires
    # protobuf~=5.29; chromadb's OpenTelemetry exporter pulls
    # googleapis-common-protos, whose newest releases need protobuf>=6.33.
    # googleapis-common-protos<1.70 works with protobuf 5.29 and keeps
    # `pip check` clean.
    "protobuf~=5.29.3",
    "googleapis-common-protos<1.70",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
regimpact = "regimpact.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regimpact*"]
