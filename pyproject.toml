[project]
name = "regimpact"
version = "0.1.0"
description = "Regulatory Change Impact Analyst — LangGraph spine + Deep Agents research + AutoGen review committee"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3",  # deepagents imports this internally at load time
    "deepagents>=0.7",
    "autogen-agentchat>=0.4",
    "autogen-ext[openai]>=0.4",
    "python-dotenv",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
regimpact = "regimpact.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regimpact*"]
